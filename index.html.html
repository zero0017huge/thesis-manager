<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f5f0">
<title>论文资料小管家</title>
<style>
:root{--bg:#f7f5f0;--paper:#fff;--ink:#292923;--muted:#77776f;--line:#e9e6de;--green:#526b58;--green2:#e8eee8;--gold:#b58a50;--shadow:0 8px 28px #2929230a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
header{padding:26px max(20px,calc((100vw - 1120px)/2));background:#fff;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:14px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:21px}
h1{font-size:21px;margin:0;font-weight:700}header p{margin:4px 0 0;color:var(--muted);font-size:13px}
main{max-width:1120px;margin:24px auto;padding:0 18px 50px}
.notice{background:#f0eee7;border:1px solid #e5e0d4;border-radius:12px;padding:12px 15px;color:#66614f;font-size:13px;margin-bottom:18px}
.layout{display:grid;grid-template-columns:255px 1fr;gap:18px;align-items:start}
.panel,.content{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.panel{padding:17px;position:sticky;top:14px}.section-label{font-size:11px;color:#999487;letter-spacing:.12em;font-weight:700;margin:2px 0 10px}
.topic{width:100%;text-align:left;border:0;background:transparent;padding:12px;border-radius:10px;color:var(--ink);cursor:pointer;margin:2px 0}
.topic.active{background:var(--green2);color:#344d3b;font-weight:650}.topic small{display:block;color:var(--muted);font-weight:400;font-size:11px;margin-top:3px}
.edit-topics{margin-top:12px;padding-top:13px;border-top:1px solid var(--line)}
button{font:inherit;cursor:pointer}.text-btn{border:0;background:none;color:var(--green);padding:5px 0;font-size:13px}
.content{padding:22px;min-height:600px}.topline{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
h2{font-size:20px;margin:0 0 4px}.sub{font-size:13px;color:var(--muted);margin:0}
.tabs{display:flex;gap:7px;margin:20px 0 16px;border-bottom:1px solid var(--line);padding-bottom:10px}
.tab{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;color:#666;font-size:13px}
.tab.active{background:var(--green);border-color:var(--green);color:#fff}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.primary{background:var(--green);color:#fff;border:0;border-radius:9px;padding:9px 14px;font-size:13px}.secondary{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;color:#555}
.search{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font:inherit;margin-bottom:13px;outline-color:#91a493}
.list{display:grid;gap:10px}.item{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;justify-content:space-between;gap:12px}.item h3{font-size:15px;margin:0 0 4px}.meta{color:var(--muted);font-size:12px}.desc{font-size:13px;color:#5f5f58;margin:7px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.file{display:inline-flex;gap:5px;align-items:center;margin-top:8px;color:var(--green);font-size:12px;text-decoration:none}
.item-actions{display:flex;gap:8px;align-items:flex-start;flex-shrink:0}.item-actions button{border:0;background:none;color:#888;font-size:12px;padding:3px}.empty{text-align:center;padding:55px 15px;color:#8b8a82}.empty strong{display:block;color:#555;margin-bottom:5px}
.modal{position:fixed;inset:0;background:#16191466;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modal.show{display:flex}.dialog{background:#fff;border-radius:16px;padding:22px;width:min(540px,100%);max-height:90vh;overflow:auto}.dialog h2{margin-bottom:16px}
label{display:block;font-size:13px;color:#555;margin:12px 0 5px}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit;background:white}textarea{min-height:85px;resize:vertical}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
footer{text-align:center;color:#999;font-size:11px;margin-top:18px}
@media(max-width:700px){header{padding:18px}.layout{grid-template-columns:1fr}.panel{position:static;padding:13px}.topic-list{display:flex;overflow:auto;gap:6px}.topic{min-width:190px;width:auto;border:1px solid var(--line)}.edit-topics{margin-top:8px}.content{padding:16px;min-height:450px}.item{display:block}.item-actions{margin-top:8px}.topline{align-items:center}}
</style>
</head>
<body>
<header><div class="brand"><div class="logo">✦</div><div><h1>论文资料小管家</h1><p>把文献、案例和写作灵感，认真收好。</p></div></div></header>
<main>
<div class="notice">当前版本会把资料保存在<strong>这台设备、这个浏览器</strong>中。附件也会保存在本机浏览器里；换手机或电脑前，请先导出备份。跨设备云端同步需要后续连接免费云数据库。</div>
<div class="layout">
<aside class="panel">
<div class="section-label">MY TOPICS · 论文选题</div>
<div class="topic-list" id="topics"></div>
<div class="edit-topics"><button class="text-btn" id="renameTopic">✎ 修改当前选题名称</button></div>
</aside>
<section class="content">
<div class="topline"><div><h2 id="topicTitle"></h2><p class="sub">独立整理该选题下的文献与案例</p></div><div class="actions"><button class="secondary" id="exportBtn">导出备份</button><button class="secondary" id="importBtn">导入备份</button><input id="backupFile" type="file" accept="application/json" hidden></div></div>
<div class="tabs"><button class="tab active" data-kind="literature">📚 文献资料</button><button class="tab" data-kind="case">⚖️ 案例资料</button></div>
<div class="topline" style="margin-bottom:12px"><p class="sub" id="countLabel">0 条资料</p><button class="primary" id="addBtn">＋ 添加资料</button></div>
<input class="search" id="search" placeholder="搜索标题、作者、案号、关键词……">
<div class="list" id="items"></div>
</section>
</div>
<footer>论文资料小管家 · 免费本地版 · 请定期导出备份</footer>
</main>
<div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle">添加资料</h2><form id="recordForm">
<label>标题 / 案件名称 *</label><input id="title" required maxlength="180" placeholder="输入文献标题或案件名称">
<label id="authorLabel">作者 / 来源</label><input id="author" maxlength="160" placeholder="作者、期刊、法院或来源">
<label id="numberLabel" style="display:none">案号 / DOI / 链接</label><input id="number" maxlength="180" placeholder="例如：(2024)……号">
<label>关键词</label><input id="tags" maxlength="180" placeholder="个人信息、网络开盒、侵权责任">
<label>摘要 / 案情与备注</label><textarea id="notes" placeholder="记录核心观点、裁判要旨、可引用内容……"></textarea>
<label>附件（PDF、Word、图片等）</label><input id="attachment" type="file">
<div class="meta" id="existingFile"></div>
<div class="dialog-actions"><button type="button" class="secondary" id="cancelBtn">取消</button><button class="primary" type="submit">保存资料</button></div>
</form></div></div>
<script>
const DB='thesis-manager-db', STORE='records';
let db, topics=[
{id:'t1',name:'网络环境下个人信息侵权的民事责任研究'},
{id:'t2',name:'网络开盒行为中个人信息侵权的民事责任研究'},
{id:'t3',name:'我的第三个选题（可修改）'}
], activeTopic='t1', kind='literature', editing=null, pendingAttachment=null;
const $=id=>document.getElementById(id);
function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function all(){return new Promise((res,rej)=>{let r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function put(x){return new Promise((res,rej)=>{let r=db.transaction(STORE,'readwrite').objectStore(STORE).put(x);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function del(id){return new Promise((res,rej)=>{let r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderTopics(){$('topics').innerHTML=topics.map(t=>`<button class="topic ${t.id===activeTopic?'active':''}" data-id="${t.id}">${esc(t.name)}<small>点击切换资料库</small></button>`).join('');document.querySelectorAll('.topic').forEach(b=>b.onclick=()=>{activeTopic=b.dataset.id;render()})}
async function render(){renderTopics();let topic=topics.find(t=>t.id===activeTopic);$('topicTitle').textContent=topic.name;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.kind===kind));let rows=(await all()).filter(x=>x.topic===activeTopic&&x.kind===kind);let q=$('search').value.trim().toLowerCase();if(q)rows=rows.filter(x=>[x.title,x.author,x.number,x.tags,x.notes].join(' ').toLowerCase().includes(q));rows.sort((a,b)=>b.updated-a.updated);$('countLabel').textContent=`${rows.length} 条资料`;if(!rows.length){$('items').innerHTML='<div class="empty"><strong>这里还空空的</strong>点击右上角「添加资料」，把第一篇文献或第一个案例收进来吧。</div>';return}
$('items').innerHTML=rows.map(x=>`<article class="item"><div style="min-width:0"><h3>${esc(x.title)}</h3><div class="meta">${esc(x.author||'未填写来源')}${x.number?' · '+esc(x.number):''} · ${new Date(x.updated).toLocaleDateString()}</div>${x.tags?`<div class="meta" style="margin-top:5px"># ${esc(x.tags)}</div>`:''}${x.notes?`<p class="desc">${esc(x.notes)}</p>`:''}${x.fileName?`<a class="file" href="#" data-file="${x.id}">📎 ${esc(x.fileName)}（点击下载）</a>`:''}</div><div class="item-actions"><button data-edit="${x.id}">编辑</button><button data-del="${x.id}">删除</button></div></article>`).join('');
document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editRecord(b.dataset.edit));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('确定删除这条资料吗？')){await del(b.dataset.del);render()}});document.querySelectorAll('[data-file]').forEach(b=>b.onclick=async e=>{e.preventDefault();let x=(await all()).find(z=>z.id===b.dataset.file);if(x?.fileData){let a=document.createElement('a');a.href=URL.createObjectURL(x.fileData);a.download=x.fileName;a.click();URL.revokeObjectURL(a.href)}else alert('没有找到附件数据')})
}
function openModal(x=null){editing=x;$('modalTitle').textContent=x?'编辑资料':'添加资料';$('title').value=x?.title||'';$('author').value=x?.author||'';$('number').value=x?.number||'';$('tags').value=x?.tags||'';$('notes').value=x?.notes||'';$('attachment').value='';pendingAttachment=null;$('existingFile').textContent=x?.fileName?'当前附件：'+x.fileName:'';$('numberLabel').style.display=kind==='case'?'block':'none';$('authorLabel').textContent=kind==='case'?'法院 / 来源':'作者 / 来源';$('modal').classList.add('show')}
async function editRecord(id){let x=(await all()).find(z=>z.id===id);openModal(x)}
$('addBtn').onclick=()=>openModal();$('cancelBtn').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};
$('attachment').onchange=e=>{pendingAttachment=e.target.files[0]||null};
$('recordForm').onsubmit=async e=>{e.preventDefault();let x=editing||{id:crypto.randomUUID(),created:Date.now()};Object.assign(x,{topic:activeTopic,kind,title:$('title').value.trim(),author:$('author').value.trim(),number:$('number').value.trim(),tags:$('tags').value.trim(),notes:$('notes').value.trim(),updated:Date.now()});if(pendingAttachment){x.fileName=pendingAttachment.name;x.fileData=pendingAttachment}await put(x);$('modal').classList.remove('show');$('search').value='';render()};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;render()});$('search').oninput=()=>render();
$('renameTopic').onclick=()=>{let t=topics.find(x=>x.id===activeTopic),n=prompt('修改选题名称：',t.name);if(n&&n.trim()){t.name=n.trim();renderTopics();$('topicTitle').textContent=t.name}};
$('exportBtn').onclick=async()=>{let records=await all();let out={version:1,topics,records:await Promise.all(records.map(async x=>{let y={...x};if(x.fileData){y.fileDataBase64=await blobToBase64(x.fileData);delete y.fileData}return y}))};let blob=new Blob([JSON.stringify(out)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='论文资料备份_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)};
function blobToBase64(blob){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(blob)})}
$('importBtn').onclick=()=>$('backupFile').click();$('backupFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let o=JSON.parse(await f.text());if(!Array.isArray(o.records))throw Error();if(confirm('导入会把备份资料加入当前资料库，不会自动删除现有内容。继续吗？')){if(Array.isArray(o.topics))topics=o.topics;for(let x of o.records){if(x.fileDataBase64){let r=await fetch(x.fileDataBase64);x.fileData=await r.blob();delete x.fileDataBase64}await put(x)}render();alert('导入完成！')} }catch(err){alert('备份文件格式不正确')}e.target.value=''};
(async()=>{db=await openDB();render()})().catch(()=>alert('浏览器暂不支持本地资料库，请更换新版 Chrome 或 Edge。'));
</script>
</body></html>
